{% extends "blog/base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<article class="post-detail">
    <h1>{{ post.title }}</h1>

    <p class="meta">
        منتشر شده در {{ post.publish }} توسط {{ post.author }}
    </p>

    <div class="body">
        {{ post.body|linebreaks }}
    </div>

    <p>
        <a href="{% url 'blog:post_list' %}">بازگشت به فهرست پست‌ها</a>
    </p>
</article>
{% endblock %}
